<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Folkstyle Arena — Tournament Day</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="toprow">
    <div class="brand">Folkstyle Arena <span class="demo-tag">DEMO DATA</span> <span class="sessionchip" id="sessionchip" hidden></span></div>
    <div class="menuwrap">
      <button id="menubtn" aria-haspopup="true" aria-expanded="false">Menu</button>
      <div id="menupanel" hidden>
        <button data-mode="studio">Card Studio</button>
        <button data-mode="guest">Bracket Generator</button>
        <label class="menuitem navsearch" for="search">Search</label>
        <button id="aboutbtn2">Architecture / About</button>
        <button id="switchsession">Switch session</button>
      </div>
    </div>
  </div>
  <div class="roleswitch" role="group" aria-label="Role">
    <span class="rolelabel">Role:</span>
    <button data-role="parent" class="on">Parent</button>
    <button data-role="organizer">Organizer</button>
    <button data-role="table">Table Worker</button>
  </div>
</header>
<nav class="modemenu" aria-label="Mode">
  <button data-mode="wrestler" class="on">My Wrestler</button>
  <button data-mode="spectator">Brackets</button>
  <button data-mode="tournament">Tournament</button>
  <button data-mode="notes">Notes</button>
  <button data-mode="organizer">Organizer</button>
  <button data-mode="table">Table</button>
  <button data-mode="guest">Bracket Generator</button>
</nav>
<div class="searchrow"><input id="search" type="search" placeholder="Search wrestlers, bouts, clubs, brackets" aria-label="Search"></div>
<div id="searchresults" hidden></div>
<main id="view"><div class="loading" aria-live="polite"><div class="skel"></div><div class="skel short"></div><p>Loading Folkstyle Arena…</p></div></main>
<div id="modal" hidden></div>
<footer class="foot"><span id="syncstate">Last updated: just now</span> · <button id="aboutbtn">Architecture / About</button></footer>
<script src="bracket.js"></script>
<script src="app.js"></script>
<script src="studio.js"></script>
</body>
</html>
